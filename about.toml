# cargo-about: the license of each crate for ATTRIBUTION.md. Regenerate with `scripts/attribution.py`; `scripts/check-all.sh`
# fails when the file is stale.
targets = ["x86_64-unknown-linux-gnu"]
# Only what ends up in the binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
# The order decides which license of a crate with a choice is used. Slint is taken under GPL-3.0-only: the program links
# libmpv and the FFmpeg libraries, which Arch builds under the GPL.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "WTFPL",
    "LGPL-2.1",
    "GPL-3.0-only",
]
