[package]
name = "rustview"
version = "0.3.47"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
heed = "0.22"
md-5 = "0.11"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "gif", "tiff", "bmp"] }
fast_image_resize = "6"
ffmpeg-next = "9"
libmpv2 = "6"
rayon = "1"
memmap2 = "0.9"
memchr = "2"
walkdir = "2"
anyhow = "1"
thiserror = "2"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
bincode = "1"
parking_lot = "0.12"
rfd = "0.15"
trash = "5"
rusqlite = { version = "0", features = ["bundled"] }
webp = "0.3"
arboard = "3"
num-format = { version = "0.4", features = ["with-system-locale"] }
# SVG rasterizer (already used by Slint); renders icons for native helper windows outside of Slint.
resvg = { version = "0.47", default-features = false }

[build-dependencies]
slint-build = "1"
toml = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

# Enable maximum SIMD & native optimizations for both the rustview crate and dependencies in dev cargo run
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
