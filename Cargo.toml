[workspace]
resolver = "3"
members = ["crates/rustview-core", "crates/rustview"]
default-members = ["crates/rustview-core", "crates/rustview"]

[workspace.package]
version = "0.6.10"
edition = "2024"
# The lowest toolchain known to work: the code uses `AtomicUsize::try_update` (1.95). rust-toolchain.toml pins `stable`.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/vommie/rustview"
homepage = "https://github.com/vommie/rustview"
readme = "README.md"
keywords = ["media", "image-viewer", "video", "gallery", "slint"]
categories = ["multimedia", "gui"]
# Applications, never published to crates.io.
publish = false

[workspace.dependencies]
rustview-core = { path = "crates/rustview-core" }

# skia (EGL) next to femtovg (GLX on X11): `system::renderer` picks one at startup.
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030", "renderer-skia-opengl"] }
slint-build = "1.18"
raw-window-handle = "0.6"
heed = "0.22"
md-5 = "0.11"
hex = "0.4"
# `avif` of the image crate is the ENCODER (ravif/rav1e); AVIF files are decoded by the FFmpeg fallback.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp", "ico", "tga", "pnm", "qoi", "hdr", "exr", "dds", "ff"] }
fast_image_resize = "6"
ffmpeg-next = "9"
libmpv2 = "6"
# The raw libmpv calls libmpv2 does not wrap: `mpv_command_ret` for `screenshot-raw` (the still of a zoomed video's minimap).
libmpv2-sys = "4"
rayon = "1"
memchr = "2"
walkdir = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
file-rotate = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# The library stores its records with bincode 1: the format is part of the on-disk data and must not change.
bincode = "1"
parking_lot = "0.12"
rfd = "0.17"
trash = "5"
# Only the XnView MP database migration reads SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
webp = "0.3"
arboard = "3"
num-format = { version = "0.4", features = ["with-system-locale"] }
# SVG rasterizer (also used by Slint); renders icons for native helper windows outside of Slint and the SVG files of the library (text and
# system fonts for labels, raster-images for embedded pictures).
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
toml = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# XDG directories of the library and settings, and `~` expansion in paths typed on the command line or found in desktop files.
directories = "6"
shellexpand = "3"
url = "2"
# /proc readers (mount table, memory, cgroups, open files) and the kernel release; no hand-written parsers.
procfs = { version = "0.18", default-features = false }
proc-mounts = "0.3"
signal-hook = "0.4"
rustix = { version = "1", features = ["system", "fs", "process"] }
# Installed applications (desktop entries, their Exec lines) and their icons from the icon themes.
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
rust-ini = "0.21"
# The X11 protocol in pure Rust (video windows, overlay windows, window manager state); x11-dl only for libmpv's Xlib error handler.
x11rb = { version = "0.13", features = ["shape", "xfixes"] }
x11-dl = "2"
# Videos are drawn with mpv's OpenGL render API into textures that Slint shows (`viewer::video_surface`): GL calls through glow, and the
# EGL entry points (loaded at runtime) for render contexts that share textures with Slint's context (GLX comes from x11-dl).
glow = "0.18"
khronos-egl = { version = "6", features = ["dynamic"] }
# The desktop portal (the application chooser of "Open With"): the same D-Bus service that sandboxed apps use, no helper processes.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
which = "8"
async-io = "2"
# Embeds the thumbnail of the drag ghost into the SVG that draws it.
base64 = "0.23"
# Numeric conversions that say what happens on overflow (saturate, wrap) instead of the silent truncation of `as`.
az = "1"
# Grapheme clusters, counted like Slint's `character-count`: names cut in the middle (`ui::middle_elide`) never split a character.
unicode-segmentation = "1"
# Image editing (crop and save): lossless JPEG crop (jpegtran in pure Rust) and re-encoding with the original quantization tables,
# the containers and headers of the formats that are written, the AVIF encoder (rav1e, pure Rust; without the assembler, which needs
# nasm), and replacing a file atomically (temporary file, fsync, rename, permissions kept).
libjpeg-turbo-rs = "0.8"
png = "0.18"
gif = "0.14"
tiff = "0.11"
image-webp = "0.2"
avif-parse = "2"
img-parts = "0.4"
bytes = "1"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
atomic-write-file = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block says why it is sound.
undocumented_unsafe_blocks = "deny"

# Pedantic lints that are switched off on purpose. Everything else of `pedantic` is fixed, not allowed.
# Both crates are applications that are never published, so there is no consumer of a public API that `#[must_use]`
# attributes and `# Errors` / `# Panics` sections would guide; the types (`Result`, `Option`, builders) already carry that.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Naming noise (`tx`/`rx`, `win_hover`/`win_unhover`); the pairs are deliberate and read well in their functions.
similar_names = "allow"
# A function that wires many Slint callbacks or maps a long list of settings is long by nature; splitting them would be an
# invasive refactor that the lint alone does not justify (they are listed in the final structure review).
too_many_lines = "allow"
# State and settings structs mirror one switch per UI control and per settings key; a state machine or enum would not be clearer.
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

# Development builds optimize everything (decoding and thumbnailing are unusably slow otherwise) but keep only line tables of
# the own crates and no debug info of the dependencies, which keeps backtraces readable and `target/` small. For a debugger
# session build with `cargo build --profile debug-full` (full debug info, binary in target/debug-full/).
[profile.dev]
opt-level = 3
debug = "line-tables-only"
# The incremental cache of an optimized dev profile grows by tens of GB a day (it once filled the disk) and saves little here.
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.debug-full]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# `cargo build --profile profiling`, then `samply record target/profiling/rustview`: release code with symbols and no abort on panic.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
panic = "unwind"
