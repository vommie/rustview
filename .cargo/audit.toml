    "RUSTSEC-2024-0436", # paste (proc macro, build time)
    "RUSTSEC-2026-0192", # ttf-parser via resvg and Wayland decorations
    "RUSTSEC-2026-0370", # zvariant (zbus stack)
    "RUSTSEC-2026-0371", # zbus_names (zbus stack)
    "RUSTSEC-2026-0372", # zvariant_derive (zbus stack)
]
