# RustView icon manifest - the single source of truth (SPoT) for every icon in the application.
#
# `build.rs` (see `build/icon_registry.rs`) validates this file against the SVG files on disk and generates
#   * `icon_registry.slint` -> Slint enum `IconId` + `IconRegistry` lookup (used by `AppIcon` in `ui/icons.slint`)
#   * `icon_registry.rs`    -> Rust enum `crate::icons::Icon` incl. metadata, name lookup and Slint conversion
# so Rust and Slint can never drift apart. To add an icon: add ONE line below (and run
# `scripts/sync-tabler-icons.sh` to fetch the SVG), then use `Icon::<PascalCase>` in Rust or
# `IconId.<kebab-case>` in Slint.
#
# Entry format (key = icon id in snake_case):
#   tabler = "<name>"    Tabler icon file name WITHOUT extension (file names are never renamed).
#   style  = "outline"   Tabler variant: "outline" (default) or "filled".
#   custom = "<file>"    Non-Tabler SVG below `assets/icons/custom/` (only rating icons).
#   color  = true        Icon keeps its own colors and is never tinted (default: false = monochrome).
#   doc    = "..."       Short description (shown in the generated API docs).
#   aliases = [...]      Additional names accepted by `Icon::from_name`.
#
# Rule: every icon is monochrome and tinted with the active theme color, except the rating icons.

[library]
tabler_version = "3.49.0"
tabler_integrity = "sha512-l+GnSkFETx0U26icxv1VUFnxxiTqXfCcVRiRAnyMwibupM2S2L/hSaZ9gmSgz01rkrsH/93NvLsxykqdanc6lw=="

[icons]
# --- Generic UI glyphs -------------------------------------------------------------------------------------------
close = { tabler = "x", doc = "Close / dismiss / clear", aliases = ["x", "dismiss", "clear"] }
check = { tabler = "check", doc = "Checked / assigned / confirmed mark" }
point = { tabler = "point", style = "filled", doc = "Small filled dot (radio mark, list bullet, leaf marker)", aliases = ["bullet", "radio"] }
search = { tabler = "search", doc = "Search / find" }
plus = { tabler = "plus", doc = "Add a new item", aliases = ["add"] }
minus = { tabler = "minus", doc = "Remove / collapse an item", aliases = ["remove"] }
settings = { tabler = "settings", doc = "Application settings", aliases = ["gear", "preferences"] }
refresh = { tabler = "refresh", doc = "Refresh / rescan / reload", aliases = ["reload"] }
loader = { tabler = "loader-2", doc = "Busy indicator (rotated by the throbber)", aliases = ["spinner", "throbber"] }
regex = { tabler = "regex", doc = "Regular expression search mode" }
chevron_down = { tabler = "chevron-down", doc = "Chevron pointing down (expanded)" }
chevron_left = { tabler = "chevron-left", doc = "Chevron pointing left (previous)" }
chevron_right = { tabler = "chevron-right", doc = "Chevron pointing right (collapsed, submenu, next)" }
arrow_left = { tabler = "arrow-left", doc = "Arrow pointing left" }
arrow_right = { tabler = "arrow-right", doc = "Arrow pointing right (from -> to)" }
arrow_down = { tabler = "arrow-down", doc = "Arrow pointing down" }
sort_ascending = { tabler = "caret-up", style = "filled", doc = "Ascending sort direction" }
sort_descending = { tabler = "caret-down", style = "filled", doc = "Descending sort direction" }
pause = { tabler = "player-pause", style = "filled", doc = "Paused state" }
pending = { tabler = "hourglass", doc = "Pending / waiting for completion" }
favorite = { tabler = "star", doc = "Favorite marker (outline star)" }
partial = { tabler = "circle-half-2", doc = "Partially assigned / mixed state" }

# --- Status ------------------------------------------------------------------------------------------------------
