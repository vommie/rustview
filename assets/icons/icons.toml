media_image = { tabler = "photo", doc = "Image media item", aliases = ["image", "photo", "picture"] }
media_video = { tabler = "movie", doc = "Video media item", aliases = ["video", "movie", "clip"] }
media_all = { tabler = "photo-video", doc = "Images and videos" }
