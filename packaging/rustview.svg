<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>RustView</title>
  <!-- A thumbnail grid with an eye over it. The eye is the Tabler "eye" outline (MIT, https://tabler.io/icons) enlarged and
       filled; its halo is the middle color of the background gradient. Only plain shapes and gradients are used so that every
       SVG renderer (librsvg, Qt, resvg) draws it the same. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3340"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cbda"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="19" y="19" width="41" height="41" rx="10" fill="url(#tile)"/>
  <rect x="68" y="19" width="41" height="41" rx="10" fill="url(#tile)"/>
  <rect x="19" y="68" width="41" height="41" rx="10" fill="url(#tile)"/>
  <rect x="68" y="68" width="41" height="41" rx="10" fill="url(#tile)"/>
  <g transform="translate(64 64) scale(3.1111) translate(-12 -12)">
    <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" fill="#222630" stroke="#222630" stroke-width="2.571" stroke-linejoin="round"/>
    <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" fill="#ff7a2f"/>
    <circle cx="12" cy="12" r="3.375" fill="#ffffff"/>
    <circle cx="12" cy="12" r="1.704" fill="#1b1f27"/>
  </g>
</svg>
